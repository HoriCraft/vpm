# sources.json に並べたリポジトリの GitHub Release を全部読み、
# VPM リポジトリの index.json を組み立てて GitHub Pages で公開する。
#
# 版ごとのメタデータは各リリース zip の中の package.json をそのまま使う。
# ここで手書きするものが無いので、リリースと一覧がズレない。
#
# パッケージを増やすときは sources.json の repos に1行足すだけでよい。
name: Build VPM Listing

on:
  workflow_dispatch:
  push:
    branches: [main]
  # パッケージ側でリリースしても、このリポジトリのワークフローは自動では動かない
  # （別リポジトリのイベントを受けるには PAT が要る）。取りこぼしを定期実行で拾う。
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.json を組み立てる
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p _site work

          LISTING_URL="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/${REPO}/index.json"
          echo "listing url: $LISTING_URL"

          echo '{}' > work/packages.json

          for SRC in $(jq -r '.repos[]' sources.json); do
            echo "::group::$SRC"
            echo '{}' > work/versions.json
            PKG_NAME=""

            for TAG in $(gh release list -R "$SRC" --limit 100 --json tagName -q '.[].tagName'); do
              rm -f work/*.zip work/pkg.json
              if ! gh release download "$TAG" -R "$SRC" --dir work --pattern '*.zip'; then
                echo "  $TAG: zip が無いので飛ばします"
                continue
              fi
              ZIP=$(ls work/*.zip 2>/dev/null | head -n1 || true)
              [ -z "$ZIP" ] && continue

              if ! unzip -p "$ZIP" package.json > work/pkg.json 2>/dev/null; then
                echo "  $TAG: zip の中に package.json がありません。飛ばします"
                continue
              fi

              PKG_NAME=$(jq -r .name work/pkg.json)
              VERSION=$(jq -r .version work/pkg.json)
              SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
              URL="https://github.com/${SRC}/releases/download/${TAG}/$(basename "$ZIP")"
              echo "  $PKG_NAME $VERSION"

              jq --arg url "$URL" --arg sha "$SHA" --arg listing "$LISTING_URL" \
                 '. + {url: $url, zipSHA256: $sha, repo: $listing}' work/pkg.json > work/entry.json

              jq --arg v "$VERSION" --slurpfile e work/entry.json \
                 '. + {($v): $e[0]}' work/versions.json > work/versions.tmp
              mv work/versions.tmp work/versions.json
            done

            if [ -z "$PKG_NAME" ]; then
              echo "::warning::$SRC には取り込めるリリースがありませんでした"
              echo "::endgroup::"
              continue
            fi

            jq --arg n "$PKG_NAME" --slurpfile v work/versions.json \
               '. + {($n): {versions: $v[0]}}' work/packages.json > work/packages.tmp
            mv work/packages.tmp work/packages.json
            echo "::endgroup::"
          done

          jq -n \
            --arg name   "$(jq -r .listing.name   sources.json)" \
            --arg id     "$(jq -r .listing.id     sources.json)" \
            --arg author "$(jq -r .listing.author sources.json)" \
            --arg url    "$LISTING_URL" \
            --slurpfile packages work/packages.json \
            '{name: $name, id: $id, author: $author, url: $url, packages: $packages[0]}' \
            > _site/index.json

          echo "--- 生成した index.json ---"
          cat _site/index.json

      - name: 案内ページを作る
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          LISTING_URL="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/${REPO}/index.json"
          # vcc:// スキームでワンクリック登録させる。URL はクエリ値なのでエンコードする。
          ENCODED=$(printf '%s' "$LISTING_URL" | jq -sRr @uri)
          VCC_LINK="vcc://vpm/addRepo?url=${ENCODED}"

          cat > _site/index.html <<HTML
          <!doctype html>
          <html lang="ja"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>HoriCraft VPM Listing</title>
          <style>
            *{box-sizing:border-box;margin:0;padding:0}
            body{font-family:system-ui,"Segoe UI","Yu Gothic UI",sans-serif;
                 background:#f6f8fb;color:#1e2330;line-height:1.75;
                 max-width:46rem;margin:0 auto;padding:3rem 1.25rem 5rem}
            h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
            .lead{color:#5a677f;margin:.5rem 0 2rem}
            .cta{background:#fff;border:1px solid #e2e7f0;border-radius:14px;
                 padding:1.75rem;margin-bottom:2rem;text-align:center}
            .btn{display:inline-block;background:#2a6fe8;color:#fff;font-weight:800;
                 font-size:1.15rem;padding:.85em 2.2em;border-radius:999px;
                 text-decoration:none;box-shadow:0 4px 14px rgba(42,111,232,.35)}
            .btn:hover{background:#1d5bc4}
            .sub{font-size:.85rem;color:#7b8496;margin-top:1rem}
            details{margin-top:1rem;font-size:.9rem;color:#5a677f}
            code{background:#eef2f8;border:1px solid #dbe3ef;border-radius:5px;
                 padding:.15rem .45rem;font-size:.9em;word-break:break-all}
            .pkg{background:#fff;border:1px solid #e2e7f0;border-radius:12px;
                 padding:1.1rem 1.3rem;margin-bottom:.75rem}
            .pkg b{font-size:1.05rem}
            .pkg .ver{color:#2a6fe8;font-weight:700;margin-left:.4rem}
            .pkg p{color:#5a677f;font-size:.9rem;margin-top:.35rem}
            h2{font-size:1.1rem;margin:2rem 0 .8rem}
            footer{margin-top:3rem;color:#8a93a8;font-size:.85rem;text-align:center}
            a{color:#2a6fe8}
          </style></head><body>

          <h1>HoriCraft VPM Listing</h1>
          <p class="lead">VCC（VRChat Creator Companion）から HoriCraft のツールを導入するためのページです。</p>

          <div class="cta">
            <a class="btn" href="${VCC_LINK}">VCC に追加する</a>
            <p class="sub">ボタンを押すと VCC が起動し、確認画面が出ます。<br>
            そのまま追加すれば、Manage Project の一覧にツールが並びます。</p>
            <details>
              <summary>ボタンが効かないとき（手動で追加する）</summary>
              <p style="margin-top:.6rem">VCC の <b>Settings → Packages → Add Repository</b> に、次の URL を貼り付けてください。</p>
              <p><code>${LISTING_URL}</code></p>
            </details>
          </div>

          <h2>収録パッケージ</h2>
          HTML

          jq -r '.packages | to_entries[] | .value.versions | to_entries | max_by(.key) | .value
                 | "<div class=\"pkg\"><b>\(.displayName)</b><span class=\"ver\">v\(.version)</span>"
                 + "<p>\(.description // "")</p>"
                 + (if .url then "<p><a href=\"\(.url)\">GitHub</a></p>" else "" end)
                 + "</div>"' _site/index.json >> _site/index.html

          cat >> _site/index.html <<'HTML'
          <footer>製作: HoriCraft</footer>
          </body></html>
          HTML

          echo "--- 生成した index.html ---"
          head -20 _site/index.html

      - name: Katachia のテスター案内を追加する
        run: |
          node scripts/verify-katachia.mjs
          mkdir -p _site/katachia
          cp -R site/katachia/. _site/katachia/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
